[project]
name = "gradi-remark"
version = "0.1.0"
description = "A wearable that watches how you move and says something about it."
requires-python = ">=3.11"
dependencies = [
    "websockets>=13.0",
    "pyserial>=3.5",
    "ollama>=0.4.0",
    "numpy>=1.26",
    "mlx-audio>=0.2.0",
    "misaki[en]>=0.9.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["host"]
